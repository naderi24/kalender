<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kalender</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kalender">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="top-row">
      <h1 id="title" class="title"></h1>
      <div class="top-actions">
        <button class="ib nav-arrow" id="prev" type="button" aria-label="Föregående"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="ib nav-arrow" id="next" type="button" aria-label="Nästa"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
        <button class="ib" id="search" type="button" aria-label="Sök"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
        <button class="ib" id="add" type="button" aria-label="Ny händelse"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
    </div>
    <div class="seg" id="seg" role="tablist" aria-label="Vy">
      <button type="button" role="tab" data-view="day">Dag</button>
      <button type="button" role="tab" data-view="week">Vecka</button>
      <button type="button" role="tab" data-view="month">Månad</button>
    </div>
  </header>
  <main id="view"></main>
  <nav class="bottom">
    <button type="button" id="today">Idag</button>
    <button type="button" id="cals">Kalendrar</button>
    <button type="button" id="ai" class="ai-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>Fråga AI</button>
  </nav>
</div>
<div id="sheets"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
